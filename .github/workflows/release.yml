name: Multi-Arch Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/amctl-${{ matrix.target }}.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/acer_monitor_cli-${{ matrix.target }}.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/amctl.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/acer_monitor_cli.exe" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: dist-artifacts/*

  build-linux-x86_64:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libclang-dev

      - name: Build Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare Artifact
        run: |
          mkdir -p dist-linux-x64
          cp "target/x86_64-unknown-linux-gnu/release/acer_monitor_cli" "dist-linux-x64/amctl-linux-x86_64"
          cp "target/x86_64-unknown-linux-gnu/release/acer_monitor_cli" "dist-linux-x64/acer_monitor_cli-linux-x86_64"
          cp "target/x86_64-unknown-linux-gnu/release/acer_monitor_cli" "dist-linux-x64/amctl"
          chmod +x dist-linux-x64/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist-linux-x64/*

  build-linux-arm64:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Install Cross Toolchain & Multiarch Libraries
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config libx11-dev:arm64 libxext-dev:arm64 libxft-dev:arm64 libxinerama-dev:arm64 libxcursor-dev:arm64 libxrender-dev:arm64 libxfixes-dev:arm64 libgl1-mesa-dev:arm64 libglu1-mesa-dev:arm64 libasound2-dev:arm64 libxkbcommon-dev:arm64 libxkbcommon-x11-dev:arm64 libfontconfig1-dev:arm64 libwayland-dev:arm64 libclang-dev

      - name: Build Binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_PATH_aarch64_unknown_linux_gnu: /usr/lib/aarch64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Prepare Artifact
        run: |
          mkdir -p dist-arm64
          cp "target/aarch64-unknown-linux-gnu/release/acer_monitor_cli" "dist-arm64/amctl-aarch64-unknown-linux-gnu"
          cp "target/aarch64-unknown-linux-gnu/release/acer_monitor_cli" "dist-arm64/amctl-linux-arm64"
          chmod +x dist-arm64/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: dist-arm64/*

  build-linux-riscv64:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu

      - name: Install Cross Toolchain & Multiarch Libraries
        run: |
          sudo dpkg --add-architecture riscv64
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu pkg-config libx11-dev:riscv64 libxext-dev:riscv64 libxft-dev:riscv64 libxinerama-dev:riscv64 libxcursor-dev:riscv64 libxrender-dev:riscv64 libxfixes-dev:riscv64 libgl1-mesa-dev:riscv64 libglu1-mesa-dev:riscv64 libasound2-dev:riscv64 libxkbcommon-dev:riscv64 libxkbcommon-x11-dev:riscv64 libfontconfig1-dev:riscv64 libwayland-dev:riscv64 libclang-dev || true

      - name: Build Binary
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
          PKG_CONFIG_PATH_riscv64gc_unknown_linux_gnu: /usr/lib/riscv64-linux-gnu/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: /
        run: cargo build --release --target riscv64gc-unknown-linux-gnu

      - name: Prepare Artifact
        run: |
          mkdir -p dist-riscv64
          cp "target/riscv64gc-unknown-linux-gnu/release/acer_monitor_cli" "dist-riscv64/amctl-riscv64gc-unknown-linux-gnu"
          cp "target/riscv64gc-unknown-linux-gnu/release/acer_monitor_cli" "dist-riscv64/amctl-linux-riscv64"
          chmod +x dist-riscv64/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-riscv64
          path: dist-riscv64/*

  create-release:
    needs: [build-windows, build-linux-x86_64, build-linux-arm64, build-linux-riscv64]
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec cp {} release-dist/ \; 2>/dev/null || true
          cp dist/* release-dist/ 2>/dev/null || true
          ls -lh release-dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
