name: Multi-Arch Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/amctl-${{ matrix.target }}.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/acer_monitor_cli-${{ matrix.target }}.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/amctl.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/acer_monitor_cli.exe" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: dist-artifacts/*

  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec cp {} release-dist/ \; 2>/dev/null || true
          cp dist/* release-dist/ 2>/dev/null || true
          ls -lh release-dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
