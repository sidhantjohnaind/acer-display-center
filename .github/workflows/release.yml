name: Multi-Arch Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: pwsh
        run: |
          mkdir -p dist
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist/amctl-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist/acer_monitor_cli-${{ matrix.target }}.exe"
          if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") {
            Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist/amctl.exe"
            Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist/acer_monitor_cli.exe"
          }
          if ("${{ matrix.target }}" -eq "aarch64-pc-windows-msvc") {
            Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist/amctl-arm64.exe"
          }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: dist/*

  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI Dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libxkbcommon-dev libfontconfig1-dev

      - name: Install Cross-compilation tools
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/acer_monitor_cli" "dist/amctl-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cp "target/${{ matrix.target }}/release/acer_monitor_cli" "dist/amctl-linux-x86_64"
            cp "target/${{ matrix.target }}/release/acer_monitor_cli" "dist/amctl"
          fi
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cp "target/${{ matrix.target }}/release/acer_monitor_cli" "dist/amctl-linux-arm64"
          fi
          if [ "${{ matrix.target }}" = "riscv64gc-unknown-linux-gnu" ]; then
            cp "target/${{ matrix.target }}/release/acer_monitor_cli" "dist/amctl-linux-riscv64"
          fi
          chmod +x dist/*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/*

  create-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p dist
          find release-artifacts -type f -exec cp {} dist/ \;
          ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
