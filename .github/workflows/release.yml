name: Multi-Arch Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-artifacts
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/amctl-${{ matrix.target }}.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/acer_monitor_cli-${{ matrix.target }}.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/amctl.exe" -Force
          Copy-Item "target/${{ matrix.target }}/release/acer_monitor_cli.exe" "dist-artifacts/acer_monitor_cli.exe" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: dist-artifacts/*

  build-linux-x86_64:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux GUI Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libclang-dev

      - name: Build Binary
        run: |
          cargo build --verbose --release --target x86_64-unknown-linux-gnu 2>&1 | tee output.txt || {
            echo "### Build x86_64 Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Prepare Artifact
        run: |
          mkdir -p dist-linux-x64
          cp target/x86_64-unknown-linux-gnu/release/acer_monitor_cli dist-linux-x64/amctl-linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/acer_monitor_cli dist-linux-x64/acer_monitor_cli-linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/acer_monitor_cli dist-linux-x64/amctl
          chmod +x dist-linux-x64/*
          ls -la dist-linux-x64/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist-linux-x64/*

  build-linux-cross:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig
        uses: korandoru/setup-zig@v1
        with:
          zig-version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build Binary with zigbuild
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          cargo zigbuild --verbose --release --target ${{ matrix.target }} 2>&1 | tee cross-output.txt || {
            echo "### Build ${{ matrix.target }} Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 cross-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Prepare Artifact
        run: |
          mkdir -p dist-cross
          cp "target/${{ matrix.target }}/release/acer_monitor_cli" "dist-cross/amctl-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/acer_monitor_cli" "dist-cross/acer_monitor_cli-${{ matrix.target }}"
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cp "target/${{ matrix.target }}/release/acer_monitor_cli" "dist-cross/amctl-linux-arm64"
            cp "target/${{ matrix.target }}/release/acer_monitor_cli" "dist-cross/acer_monitor_cli-linux-arm64"
          fi
          if [ "${{ matrix.target }}" = "riscv64gc-unknown-linux-gnu" ]; then
            cp "target/${{ matrix.target }}/release/acer_monitor_cli" "dist-cross/amctl-linux-riscv64"
            cp "target/${{ matrix.target }}/release/acer_monitor_cli" "dist-cross/acer_monitor_cli-linux-riscv64"
          fi
          chmod +x dist-cross/*
          ls -la dist-cross/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist-cross/*

  create-release:
    needs: [build-windows, build-linux-x86_64, build-linux-cross]
    runs-on: ubuntu-latest
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p release-dist
          find release-artifacts -type f -exec cp {} release-dist/ \; 2>/dev/null || true
          cp dist/* release-dist/ 2>/dev/null || true
          ls -lh release-dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-dist/*
          overwrite: true
          draft: false
          prerelease: false
          generate_release_notes: true
